<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт накладных</title>
    <!-- Подключаем Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="script.js" defer></script>
    <style>
        body {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #2E7D32;
            text-align: center;
        }
        .btn-custom {
            background: #388E3C;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background: #2E7D32;
        }
        table {
            width: 100%;
            margin-top: 20px;
            background: white;
        }
        th {
            background: #388E3C;
            color: white;
        }
        video {
            width: 100%;
            border-radius: 5px;
            margin-top: 20px;
        }
        input {
            border: 1px solid #4CAF50;
            padding: 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📦 Учёт накладных</h2>

        <!-- Форма добавления товара -->
        <div class="mb-3">
            <input type="text" id="product_number" class="form-control" placeholder="🔢 Номер продукта">
        </div>
        <div class="mb-3">
            <input type="text" id="name" class="form-control" placeholder="📦 Наименование">
        </div>
        <div class="mb-3">
            <input type="number" id="quantity" class="form-control" placeholder="🔢 Количество">
        </div>
        <div class="mb-3">
            <input type="text" id="serial_number" class="form-control" placeholder="📄 Серийный номер">
        </div>
        <div class="mb-3">
            <input type="date" id="arrival_date" class="form-control">
        </div>
        <div class="mb-3">
            <input type="number" id="price" class="form-control" placeholder="💰 Цена">
        </div>

        <button class="btn-custom w-100" onclick="addProduct()">➕ Добавить товар</button>

        <!-- Список товаров -->
        <h2>📋 Список товаров</h2>
        <button class="btn-custom w-100" onclick="loadProducts()">🔄 Обновить список</button>
        <button class="btn-custom w-100" onclick="exportToExcel()">📤 Экспорт в Excel</button>
        <button class="btn-custom w-100" onclick="clearProductList()">❌ Очистить список</button>

        <table class="table table-bordered text-center">
            <thead>
                <tr>
                    <th>Номер продукта</th>
                    <th>Наименование</th>
                    <th>Количество</th>
                    <th>Серийный номер</th>
                    <th>Дата прихода</th>
                    <th>Цена</th>
                </tr>
            </thead>
            <tbody id="product_list"></tbody>
        </table>

        <!-- Сканер штрих-кодов -->
        <h2>📸 Сканер штрих-кодов</h2>
        <button class="btn-custom w-100" onclick="startScanner()">📷 Запустить сканер</button>
        <video id="scanner" class="mt-3" style="display: none;"></video>
    </div>
</body>
</html>
